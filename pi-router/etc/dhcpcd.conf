# /etc/dhcpcd.conf — Raspberry Pi Router
# Assigns a static IP to the LAN interface (wlan0) so devices have a
# consistent gateway address. The WAN interface (eth0) gets its IP from
# the ISP modem via DHCP — no changes needed for eth0 here.

interface wlan0
    static ip_address=192.168.1.1/24
    nohook wpa_supplicant
