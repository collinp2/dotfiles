# /etc/dnsmasq.conf — Raspberry Pi Router
# Provides DHCP and DNS for the LAN (wlan0).

# Only listen on the LAN interface
interface=wlan0

# DHCP range: hand out .50–.200, 24h lease
dhcp-range=192.168.1.50,192.168.1.200,255.255.255.0,24h

# Don't forward plain (non-dotted) hostnames upstream
domain-needed

# Don't forward private IP reverse lookups upstream
bogus-priv

# Optional: use Cloudflare and Google as upstream DNS resolvers
# (comment out to use your ISP's DNS instead)
server=1.1.1.1
server=8.8.8.8

# Optional: assign a static IP to a specific device by MAC address
# dhcp-host=aa:bb:cc:dd:ee:ff,192.168.1.10,my-device
