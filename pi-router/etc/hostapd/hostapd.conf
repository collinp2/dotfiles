# /etc/hostapd/hostapd.conf — Raspberry Pi Router
# Configures the built-in WiFi chip (wlan0) as a WPA2 access point.
# Edit SSID and wpa_passphrase before deploying.

interface=wlan0
driver=nl80211

# Network name and password — CHANGE THESE
ssid=MyHomeNetwork
wpa_passphrase=ChangeThisPassword

# 2.4GHz 802.11n, channel 6 (1, 6, and 11 are non-overlapping)
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# WPA2-PSK (AES/CCMP only — no TKIP)
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Don't hide the SSID
ignore_broadcast_ssid=0
